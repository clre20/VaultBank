# VaultBank 設定檔
# 缺少的項目會在啟動與 /vb reload 時自動補上，保留你原本的值（補之前會備份成 config.yml.bak）。
config-version: 1

# ---------- 貨幣 ----------
currency:
  # 銀行餘額的小數位數（0～4）。實體貨幣與支票只能是整數。
  decimal-places: 2
  # 新玩家的起始餘額
  default-balance: 0
  # 單一帳戶的餘額上限
  max-balance: 10000000000000

# 「元」的個別面額是否可以提取（關掉後仍可存入已經發出去的）
denominations:
  coin-1: true
  coin-5: true
  coin-10: true
  coin-50: true
  note-100: true
  note-500: true
  note-1000: true

# ---------- 其他幣種 ----------
# 每個幣種有自己的銀行餘額。Vault 只綁定「元」，其他幣種給本插件的指令與介面、PlaceholderAPI、
# 以及用 VaultBank API 的插件（例如 AetherMart 的 type: vaultbank）使用。
# 鍵是幣種 id（a-z、0-9、_，最多 16 字），指令用它，例如 /pay Steve 10 penguin。
# 幣種名稱與金額格式在 messages.yml 的 currencies.<幣種 id>。
#
# 外觀（每個面額）：把檔案放在 plugins/VaultBank/textures/，檔名用面額 id
#   <面額id>.json  Java 版模型（例如 Blockbench 匯出），模型用到的貼圖也放在同一個資料夾
#   <面額id>.png   圖片，自動加上 thickness 的厚度變成立體
#   都沒有        用 material 的原版物品外觀
#   appearance: vanilla 強制用原版物品外觀
# 基岩版一律顯示 2D 圖示（<面額id>.png，沒有時用模型的第一張貼圖）。改完 /vb reload。
currencies:
  penguin:
    # 預設停用，改成 true 後 /vb reload
    enabled: false
    # 小數位數（0 = 只能是整數）
    decimal-places: 0
    default-balance: 0
    max-balance: 1000000000
    # 個別功能開關
    features:
      pay: true
      cheque: true
      interest: true
      baltop: true
      physical: true
    pay:
      min-amount: 1
      fee-percent: 0
    cheque:
      min-amount: 1
      max-amount: 0
      fee-percent: 0
    # 發放間隔與是否只發給在線玩家用下面 interest 區段的設定，該區段的 enabled 也要開
    interest:
      rate-percent: 0.1
      max-per-payout: 0
    # 第一次啟用時匯入 ExcellentEconomy 的貨幣（填 ExcellentEconomy 的貨幣 id，留空 = 不匯入）
    # 匯入時 ExcellentEconomy 要在執行中，或 plugins/ExcellentEconomy 資料夾還在；只匯入一次
    import:
      excellent-economy: ""
    # 實體貨幣的面額（面額 id 在所有幣種之間不能重複）
    denominations:
      penguin_1:
        value: 1
        enabled: true
        # 沒有模型與圖片時的原版物品外觀
        material: prismarine_crystals
        # 用圖片自動加厚度時的厚度（一格方塊 = 16）
        thickness: 1.5
        # auto = 模型 > 圖片 > 原版物品；vanilla = 強制原版物品
        appearance: auto

# ---------- 兌換 ----------
exchange:
  # 預設停用
  enabled: false
  # 手續費（百分比，從換到的數量扣）
  fee-percent: 0
  # 每一組：1 個 from ＝ rate 個 to
  #   allow-reverse: true 兩個方向都能換；false 只能 from → to（預設的 元 → 企鵝幣 不能換回元）
  #   mode: fixed    固定匯率
  #   mode: floating 浮動匯率：全服換越多，匯率被推得越遠（像不同國家的外匯）；沒人換時慢慢回到 rate
  #     liquidity：市場深度（以 to 計），越大匯率越難被推動
  #     recover-percent-per-hour：每小時往 rate 回復的比例
  #     min-rate／max-rate：匯率上下限，會超出的兌換直接拒絕
  pairs:
    yuan_penguin:
      from: yuan
      to: penguin
      allow-reverse: false
      mode: fixed
      rate: 0.01
      floating:
        liquidity: 100000
        recover-percent-per-hour: 5
        min-rate: 0.001
        max-rate: 0.1

# ---------- 存檔 ----------
storage:
  # 餘額變動後幾秒內寫入資料庫（批次寫入，1～300）
  save-interval-seconds: 5

# ---------- 排行榜 ----------
baltop:
  # 幾秒重新排序一次
  update-interval-seconds: 300
  # 聊天室每頁幾名（/baltop）
  page-length: 10
  # 餘額至少多少才列入排行榜
  min-balance: 0.01

# ---------- 轉帳（元；其他幣種在 currencies.<幣種>.pay） ----------
pay:
  # 最低轉帳金額
  min-amount: 0.01
  # 手續費（百分比，由付款人另外支付；0 = 不收）
  fee-percent: 0

# ---------- 提取 ----------
withdraw:
  # 一次最多提取幾枚／張（上限 2304 = 36 格 × 64）
  max-items: 2304

# ---------- 支票（元；其他幣種在 currencies.<幣種>.cheque） ----------
cheque:
  # 最低面額（整數）
  min-amount: 1
  # 最高面額（0 = 不限制）
  max-amount: 0
  # 手續費（百分比，由開票人另外支付；0 = 不收）
  fee-percent: 0

# ---------- 利息 ----------
interest:
  enabled: false
  # 每次發放的利率（百分比）
  rate-percent: 0.1
  # 幾小時發放一次（以第一次開啟時開始計時，重啟不會重發）
  interval-hours: 24
  # 每人每次最多發多少（0 = 不限制）
  max-per-payout: 0
  # 只發給發放當下在線的玩家
  online-only: true

# 其他幣種的利率在 currencies.<幣種>.interest

# ---------- 交易紀錄 ----------
logs:
  enabled: true
  # 保留天數，超過的每小時自動刪除
  retention-days: 30
  # 記錄其他插件透過 Vault 的存提（例如商店、在線獎勵）
  log-plugin-transactions: true
  # 聊天室每頁幾筆（/vb log <頁>）
  page-size: 10

# ---------- 防偽 ----------
anti-counterfeit:
  # 有人存入偽造貨幣、已兌現的支票，或貨幣回收量超過發行量時，通知線上有 vaultbank.admin.alert 權限的人
  alert-admins: true
  # 偽造貨幣與已兌現的支票直接沒收（false = 退回給玩家）
  confiscate-invalid: false

# ---------- 材質包 ----------
resource-pack:
  java:
    enabled: true
    # 玩家必須接受材質包才能進服
    required: false
    # 沒有安裝 HttpHub 時，自己架設 plugins/VaultBank/pack/VaultBank-java.zip 的網址（例如 https://example.com/VaultBank-java.zip）
    url: ""
    # 玩家登入後幾 tick 發送（20 tick = 1 秒）
    delay-ticks: 20
  bedrock:
    # 自動把 .mcpack 與自訂物品對照檔放進 Geyser 的資料夾（Geyser 重啟後生效）
    enabled: true
    # Geyser 資料夾；留空 = 自動找 plugins/Geyser-Spigot
    geyser-folder: ""
  # 「元」與支票用圖片時的 3D 厚度（一格方塊 = 16）；其他幣種在 currencies.<幣種>.denominations.<面額>.thickness
  model:
    coin-thickness: 1.5
    note-thickness: 0.5
    cheque-thickness: 0.5
    cheque-roll-thickness: 2.0

# ---------- 介面 ----------
gui:
  # 聊天室輸入的逾時秒數
  chat-input-timeout-seconds: 60
  # 同一玩家存入、提取、開支票、查交易紀錄的最短間隔（毫秒，0 = 不限制），避免洗指令
  action-cooldown-ms: 500
  # 基岩版玩家從一個介面換到另一個介面時，先關閉再等幾 tick 打開（太短時基岩版會把介面立刻關掉）
  bedrock-open-delay-ticks: 6

# ---------- 匯入 ----------
migration:
  # 第一次啟動時匯入 plugins/TheosisEconomy/player-accounts 的餘額（只匯入一次，不改動原檔）
  import-theosis-economy: true

# ---------- 更新檢查 ----------
update-checker:
  # 啟動時在背景向 GitHub Releases 檢查一次
  check-on-startup: true
  # 有新版本時，擁有 vaultbank.version 權限的人登入 3 秒後收到提醒
  notify-on-join: true
